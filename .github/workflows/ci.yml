name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Test every feature combination
        run: cargo hack test --feature-powerset --lib --tests
      - name: Test documentation examples for every feature combination
        run: cargo hack test --feature-powerset --doc

  quality:
    name: Formatting, Clippy, docs and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every feature combination
        run: cargo hack clippy --feature-powerset --lib --tests -- -D warnings
      - name: Lint benchmarks and hosted examples
        run: cargo clippy --all-targets --features serde -- -D warnings
      - name: Lint the standalone no_std example
        run: cargo clippy --example no_std --features no_std -- -D warnings
      - name: Build documentation for every feature combination
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo hack doc --feature-powerset --no-deps
      - name: Run examples
        shell: bash
        run: |
          for example in basic search logic fields text words; do
            cargo run --example "$example"
          done
          cargo run --example no_std --features no_std
      - name: Verify crate packaging
        run: cargo package

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Check every feature combination without dev dependencies
        run: cargo hack check --feature-powerset --no-dev-deps --lib

  embedded:
    name: Bare-metal no_std
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Build without std or alloc
        run: cargo build --release --lib --target thumbv7em-none-eabihf --no-default-features --features no_std
      - name: Build no_std with every combination of alloc and serde
        run: >-
          cargo hack build --release --lib --target thumbv7em-none-eabihf
          --feature-powerset --include-features alloc,serde --features no_std

  optimized:
    name: Native CPU release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    env:
      RUSTFLAGS: -C target-cpu=native
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test optimized native CPU paths
        run: cargo test --release --lib --tests
      - name: Test optimized native CPU paths with all features
        run: cargo test --release --lib --tests --all-features
