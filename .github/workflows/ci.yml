name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - name: Test every feature combination
        run: just test

  quality:
    name: Formatting, Clippy, docs and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - name: Check formatting
        run: just fmt
      - name: Lint every feature combination
        run: just clippy
      - name: Build documentation for every feature combination
        run: just doc-check
      - name: Run examples
        run: just examples
      - name: Verify crate packaging
        run: just package

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.85"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - name: Check every feature combination without dev dependencies
        run: just msrv

  embedded:
    name: Bare-metal no_std
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - name: Build every bare-metal feature combination
        run: just no-std

  optimized:
    name: Native CPU release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Test optimized native CPU paths
        run: just test-native
